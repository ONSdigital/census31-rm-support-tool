---
name: Checks and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-checks-and-tests:
    name: Java Checks and Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Google auth allows Maven to pull artifacts from our registry
      # and acquires a token for authenticating with the Docker registry.
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_CI_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Log in to Google Docker Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: europe-west2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set up Docker network
        run: docker network create censusrmdockerdev_default

      - name: Maven checks
        run: make check-mvn

      - name: Run Maven tests
        run: make test-mvn

  node-checks:
    name: Node Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: make install

      - name: Run format check
        run: make format-check

      - name: Run lint
        run: npx eslint .

      - name: Run unit tests
        run: npm test

      - name: Run package audit
        run: make package-audit
